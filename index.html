<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fa" />
  <title>yCard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/omegon-theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 대시보드 -->
  <div id="dashboardView" class="app-shell">
    <header class="app-header">
      <h1 class="app-title">내 카드</h1>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-open-sheet aria-label="혜택 보기">+</button>
        <button type="button" class="icon-btn" data-later aria-label="설정">⚙</button>
      </div>
    </header>

    <main class="app-main">
      <p id="summaryCard" class="summary-line" hidden>
        <span id="summaryText">기억 0장</span>
      </p>

      <div id="cardList" class="card-list"></div>

      <section id="emptyState" class="rich-card">
        <p class="summary-text">카드를 찍고 혜택을 확인해 보세요</p>
        <p class="guide-text">카메라나 앨범으로 카드 앞면을 올려 주세요.</p>
      </section>
    </main>

    <footer class="app-footer">
      <button type="button" class="primary-btn" data-open-sheet>카메라로 혜택 보기</button>
    </footer>
  </div>

  <!-- 촬영 미리보기: AI 전송 직전 -->
  <div id="previewView" class="app-shell" hidden>
    <header class="app-header">
      <button type="button" id="previewBackBtn" class="icon-btn" aria-label="뒤로">←</button>
      <h1 class="app-title">사진 확인</h1>
      <span class="header-spacer"></span>
    </header>
    <main class="app-main">
      <p class="guide-text">반드시 카드 앞면을 업로드 해주세요.<br>카드번호가 보이는 화면은 촬영하지 마세요.</p>
      <img id="previewImage" class="preview-image" alt="선택한 카드 사진" />
      <p id="previewMeta" class="preview-meta"></p>

      <section class="ocr-confirm-box">
        <p id="ocrStatusText" class="guide-text">글자를 읽고 있어요…</p>
        <label class="form-label" for="ocrCardCompanyInput">카드사</label>
        <input id="ocrCardCompanyInput" class="form-input" type="text" placeholder="예: 신한카드" autocomplete="off" />
        <label class="form-label" for="ocrCardNameInput">카드명</label>
        <input id="ocrCardNameInput" class="form-input" type="text" placeholder="예: 딥오일" autocomplete="off" />
        <p class="guide-text">자동으로 읽은 글자예요. 틀리면 직접 고쳐 주세요.</p>
      </section>
    </main>
    <footer class="app-footer">
      <button type="button" id="analyzeReadyBtn" class="primary-btn">혜택 보기</button>
      <button type="button" id="previewRetryBtn" class="ghost-btn">다시 촬영 / 선택</button>
    </footer>
  </div>

  <!-- 혜택 보기: 읽기 전용 -->
  <div id="benefitView" class="app-shell" hidden>
    <header class="app-header">
      <button type="button" id="benefitBackBtn" class="icon-btn" aria-label="뒤로">←</button>
      <h1 class="app-title">혜택 보기</h1>
      <span class="header-spacer"></span>
    </header>
    <main class="app-main">
      <section class="result-head">
        <label class="form-label" for="resultCardNameInput">카드명</label>
        <input id="resultCardNameInput" class="form-input result-card-name-input" type="text" placeholder="카드명을 입력해 주세요" autocomplete="off" />
        <p id="resultCardCompany" class="result-card-company"></p>
      </section>

      <div id="benefitList" class="benefit-list"></div>

      <section class="notice-box">
        <p>자세한 한도와 카드별 혜택은 아래에서 확인해주세요</p>
        <div class="link-row">
          <a id="cardSearchLinkBtn" class="link-btn" target="_blank" rel="noopener noreferrer" hidden>이 카드 정보 보기</a>
          <a id="officialLinkBtn" class="link-btn" target="_blank" rel="noopener noreferrer" hidden>카드사 홈페이지</a>
        </div>
      </section>
    </main>
    <footer class="app-footer">
      <div class="footer-actions">
        <button type="button" id="cancelResultBtn" class="outline-btn">취소</button>
        <button type="button" id="rememberCardBtn" class="primary-btn">기억</button>
      </div>
    </footer>
  </div>

  <!-- 촬영 / 앨범 선택 -->
  <div id="actionSheet" class="sheet" hidden>
    <div class="sheet-dim" data-sheet-dim></div>
    <div class="sheet-panel" role="dialog" aria-label="사진 등록">
      <button type="button" class="sheet-item" data-sheet-camera>사진 촬영</button>
      <button type="button" class="sheet-item" data-sheet-gallery>앨범에서 선택</button>
      <button type="button" class="sheet-item sheet-cancel" data-sheet-cancel>취소</button>
    </div>
  </div>

  <div id="confirmModal" class="modal" hidden>
    <div class="sheet-dim" data-confirm-dim></div>
    <div class="modal-panel" role="dialog" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle" data-confirm-title></h2>
      <div class="footer-actions modal-actions">
        <button type="button" class="outline-btn" data-confirm-cancel>취소</button>
        <button type="button" class="primary-btn" data-confirm-ok>기억</button>
      </div>
    </div>
  </div>

  <div id="errorModal" class="modal" hidden>
    <div class="sheet-dim" data-error-dim></div>
    <div class="modal-panel" role="alertdialog">
      <h2 data-error-title></h2>
      <p data-error-body></p>
      <button type="button" class="ghost-btn" data-error-secondary hidden></button>
      <button type="button" class="primary-btn" data-error-close>확인</button>
    </div>
  </div>

  <div id="loadingOverlay" class="loading" hidden>
    <div class="loading-box">
      <p id="loadingText">사진을 준비하고 있어요</p>
      <button type="button" id="loadingCancelBtn" class="ghost-btn" hidden>취소</button>
    </div>
  </div>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="galleryInput" type="file" accept="image/*" hidden />

  <div id="appToast" class="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
