<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8fa" />
  <title>yCard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/omegon-theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 대시보드 -->
  <div id="dashboardView" class="app-shell">
    <header class="app-header">
      <h1 class="app-title">내 카드</h1>
      <div class="header-actions">
        <button type="button" class="icon-btn" data-open-sheet aria-label="카드 등록">+</button>
        <button type="button" class="icon-btn" data-later aria-label="설정">⚙</button>
      </div>
    </header>

    <main class="app-main">
      <section id="summaryCard" class="rich-card" hidden>
        <p class="summary-label">이번 달 요약</p>
        <p id="summaryText" class="summary-text">등록 0장</p>
      </section>

      <div id="cardList" class="card-list"></div>

      <section id="emptyState" class="rich-card">
        <p class="summary-text">첫 카드를 등록하고 혜택을 정리해 보세요</p>
        <p class="guide-text">카메라나 앨범으로 카드 앞면을 올려 주세요.</p>
      </section>
    </main>

    <footer class="app-footer">
      <button type="button" class="primary-btn" data-open-sheet>카메라로 카드 등록</button>
    </footer>
  </div>

  <!-- 촬영 미리보기: AI 전송 직전 -->
  <div id="previewView" class="app-shell" hidden>
    <header class="app-header">
      <button type="button" id="previewBackBtn" class="icon-btn" aria-label="뒤로">←</button>
      <h1 class="app-title">사진 확인</h1>
      <span class="header-spacer"></span>
    </header>
    <main class="app-main">
      <p class="guide-text">반드시 카드 앞면을 업로드 해주세요.<br>카드번호가 보이는 화면은 촬영하지 마세요.</p>
      <img id="previewImage" class="preview-image" alt="선택한 카드 사진" />
      <p id="previewMeta" class="preview-meta"></p>
    </main>
    <footer class="app-footer">
      <button type="button" id="analyzeReadyBtn" class="primary-btn">분석하기</button>
      <button type="button" id="previewRetryBtn" class="ghost-btn">다시 촬영 / 선택</button>
    </footer>
  </div>

  <!-- AI 결과 확인 / 수정 -->
  <div id="confirmView" class="app-shell" hidden>
    <header class="app-header">
      <button type="button" id="confirmBackBtn" class="icon-btn" aria-label="뒤로">←</button>
      <h1 class="app-title">결과 확인</h1>
      <span class="header-spacer"></span>
    </header>
    <main class="app-main">
      <p class="guide-text">틀린 부분은 저장 전에 고쳐 주세요.</p>

      <label class="form-label" for="inputCardName">카드명</label>
      <input id="inputCardName" class="form-input" type="text" placeholder="예: 신한 Deep Oil" />

      <label class="form-label" for="inputCardCompany">카드사</label>
      <input id="inputCardCompany" class="form-input" type="text" placeholder="예: 신한카드" />

      <label class="form-label" for="inputCardType">카드 종류</label>
      <select id="inputCardType" class="form-input">
        <option value="CREDIT">신용</option>
        <option value="CHECK">체크</option>
        <option value="UNKNOWN">기타</option>
      </select>

      <label class="form-label" for="inputPerformanceNote">전월실적</label>
      <input id="inputPerformanceNote" class="form-input" type="text" placeholder="예: 전월실적 30만원 이상" />
      <input id="inputPerformanceSpend" class="form-input" type="number" inputmode="numeric" min="0" step="10000" placeholder="전월실적 금액(원)" />

      <div class="form-label-row">
        <label class="form-label" for="addBenefitBtn">주요 혜택</label>
        <button type="button" id="addBenefitBtn" class="text-btn">혜택 추가</button>
      </div>
      <div id="benefitList" class="benefit-list"></div>
    </main>
    <footer class="app-footer">
      <button type="button" id="saveCardBtn" class="primary-btn">내 카드에 저장</button>
      <button type="button" id="confirmRetryBtn" class="ghost-btn">다시 촬영 / 선택</button>
    </footer>
  </div>

  <!-- 촬영 / 앨범 선택 -->
  <div id="actionSheet" class="sheet" hidden>
    <div class="sheet-dim" data-sheet-dim></div>
    <div class="sheet-panel" role="dialog" aria-label="사진 등록">
      <button type="button" class="sheet-item" data-sheet-camera>사진 촬영</button>
      <button type="button" class="sheet-item" data-sheet-gallery>앨범에서 선택</button>
      <button type="button" class="sheet-item sheet-cancel" data-sheet-cancel>취소</button>
    </div>
  </div>

  <div id="errorModal" class="modal" hidden>
    <div class="sheet-dim" data-error-dim></div>
    <div class="modal-panel" role="alertdialog">
      <h2 data-error-title></h2>
      <p data-error-body></p>
      <button type="button" class="ghost-btn" data-error-secondary hidden></button>
      <button type="button" class="primary-btn" data-error-close>확인</button>
    </div>
  </div>

  <div id="loadingOverlay" class="loading" hidden>
    <div class="loading-box">
      <p id="loadingText">사진을 준비하고 있어요</p>
      <button type="button" id="loadingCancelBtn" class="ghost-btn" hidden>취소</button>
    </div>
  </div>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="galleryInput" type="file" accept="image/*" hidden />

  <div id="appToast" class="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
