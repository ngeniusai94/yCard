<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yCard · Omegon Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="omegon-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            foreground: "var(--foreground)",
            card: "var(--card)",
            primary: "var(--primary)",
            "primary-foreground": "var(--primary-foreground)",
            secondary: "var(--secondary)",
            muted: "var(--muted)",
            "muted-foreground": "var(--muted-foreground)",
            border: "var(--border)",
          },
          borderRadius: { lg: "var(--radius)" },
          boxShadow: { theme: "var(--shadow)", "theme-lg": "var(--shadow-lg)" },
        },
      },
    };
  </script>
  <style>
    body.embed { min-height: auto; padding: 0; background: transparent; }
    body.embed .page-meta, body.embed .back-link { display: none; }
    .tag-primary { background: color-mix(in oklch, var(--primary) 14%, transparent); color: var(--primary); }
    .tag-secondary { background: color-mix(in oklch, var(--secondary) 16%, transparent); color: var(--secondary); }
    .badge-muted { background: var(--muted); color: var(--muted-foreground); }
  </style>
</head>
<body class="min-h-screen bg-muted py-8">
  <p class="page-meta mb-1 text-center text-xs font-semibold tracking-wide text-primary">SELECTED · MINT PRIMARY</p>
  <p class="page-meta mb-4 text-center text-sm font-medium text-muted-foreground">메인 민트 · 보조 인디고 · Light only</p>

  <div class="relative mx-auto flex h-[812px] w-[390px] flex-col overflow-hidden rounded-[28px] border border-border bg-background shadow-theme-lg">
    <div class="h-11 bg-card"></div>
    <header class="flex h-14 shrink-0 items-center justify-between bg-card px-5">
      <h1 class="text-xl font-bold text-foreground">내 카드</h1>
      <div class="flex gap-1 text-xl text-foreground">
        <span class="flex h-11 w-11 items-center justify-center">+</span>
        <span class="flex h-11 w-11 items-center justify-center text-base">⚙</span>
      </div>
    </header>

    <main class="flex-1 space-y-3 overflow-y-auto px-5 py-4">
      <section class="rounded-lg bg-card px-4 py-3 shadow-theme">
        <p class="text-xs font-semibold text-muted-foreground">이번 달 요약</p>
        <p class="mt-1 text-[15px] font-bold text-foreground">등록 3장 · 주유 · 카페 · 쇼핑 혜택</p>
      </section>

      <article class="rounded-lg bg-card p-4 shadow-theme">
        <div class="flex items-start justify-between">
          <p class="text-[13px] text-muted-foreground">신한카드 · <span class="tag-primary rounded-full px-2 py-0.5 text-[11px] font-semibold">신용</span></p>
          <span class="tag-secondary rounded-full px-2 py-0.5 text-[11px] font-semibold">실적 30만</span>
        </div>
        <h2 class="mt-2 text-lg font-bold text-foreground">Deep Oil</h2>
        <div class="mt-3 flex flex-wrap gap-1.5">
          <span class="tag-primary rounded-full px-2.5 py-1 text-xs font-semibold">주유 60원/L</span>
          <span class="tag-secondary rounded-full px-2.5 py-1 text-xs font-semibold">커피 10%</span>
          <span class="badge-muted rounded-full px-2.5 py-1 text-xs font-semibold">+2</span>
        </div>
      </article>

      <article class="rounded-lg bg-card p-4 shadow-theme">
        <div class="flex items-start justify-between">
          <p class="text-[13px] text-muted-foreground">현대카드 · <span class="tag-secondary rounded-full px-2 py-0.5 text-[11px] font-semibold">체크</span></p>
          <span class="badge-muted rounded-full px-2 py-0.5 text-[11px] font-semibold">실적 없음</span>
        </div>
        <h2 class="mt-2 text-lg font-bold text-foreground">ZERO Edition2</h2>
        <div class="mt-3 flex flex-wrap gap-1.5">
          <span class="tag-primary rounded-full px-2.5 py-1 text-xs font-semibold">모든 가맹 0.7%</span>
          <span class="tag-secondary rounded-full px-2.5 py-1 text-xs font-semibold">온라인 1.5%</span>
        </div>
      </article>

      <article class="rounded-lg bg-card p-4 shadow-theme">
        <div class="flex items-start justify-between">
          <p class="text-[13px] text-muted-foreground">삼성카드 · <span class="tag-primary rounded-full px-2 py-0.5 text-[11px] font-semibold">신용</span></p>
          <span class="tag-secondary rounded-full px-2 py-0.5 text-[11px] font-semibold">실적 40만</span>
        </div>
        <h2 class="mt-2 text-lg font-bold text-foreground">taptap O</h2>
        <div class="mt-3 flex flex-wrap gap-1.5">
          <span class="tag-primary rounded-full px-2.5 py-1 text-xs font-semibold">스타벅스 50%</span>
          <span class="tag-primary rounded-full px-2.5 py-1 text-xs font-semibold">통신 10%</span>
        </div>
      </article>
    </main>

    <footer class="shrink-0 border-t border-border bg-card px-5 pb-6 pt-3">
      <button type="button" class="h-[52px] w-full rounded-lg bg-primary text-base font-bold text-primary-foreground">카메라로 카드 등록</button>
    </footer>
  </div>

  <p class="back-link mt-6 text-center text-sm"><a class="text-primary" href="index.html">← 시안 홈</a></p>
  <script>if (window.self !== window.top) document.body.classList.add("embed");</script>
</body>
</html>
