<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yCard · Omegon Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="omegon-theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "var(--background)",
            foreground: "var(--foreground)",
            primary: "var(--primary)",
            "muted-foreground": "var(--muted-foreground)",
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .preview { width: 390px; height: 812px; transform: scale(0.72); transform-origin: top left; }
    .preview-wrap { width: calc(390px * 0.72); height: calc(812px * 0.72); }
  </style>
</head>
<body class="min-h-screen bg-background text-foreground">
  <main class="mx-auto max-w-3xl px-5 py-10">
    <p class="text-sm font-semibold text-primary">SELECTED · Light</p>
    <h1 class="mt-2 text-3xl font-bold tracking-tight">민트 메인 · 인디고 보조</h1>
    <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-muted-foreground">
      Dark는 쓰지 않습니다. CTA는 민트, 배지·보조 강조는 인디고입니다.
    </p>
    <a href="ThemeOmegonLight.html" class="mt-8 inline-block">
      <div class="preview-wrap overflow-hidden rounded-[24px] shadow-lg ring-1 ring-black/5">
        <iframe class="preview pointer-events-none" src="ThemeOmegonLight.html" title="Omegon Light"></iframe>
      </div>
    </a>
  </main>
</body>
</html>
